name: Publish
on:
  release:
    types: [published]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # Attach release artifacts.
      id-token: write # Obtain the attestation identity.
      attestations: write # Store signed artifact provenance.
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check release and archive source
        run: |
          printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          go test ./...
          git archive --format=tar.gz --output=sdk-go.tar.gz HEAD
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sdk-go.tar.gz
      - name: Attach release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" sdk-go.tar.gz --repo "$GITHUB_REPOSITORY"
      - name: Check the module proxy and exact-version consumer
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          go list -m "github.com/EASYSLIP-CO-LTD/sdk-go@$RELEASE_TAG"
          mkdir /tmp/published
          cp scripts/consumer/main.go /tmp/published/main.go
          cd /tmp/published
          go mod init example.com/consumer
          go get "github.com/EASYSLIP-CO-LTD/sdk-go@$RELEASE_TAG"
          go run .
