name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go run ./scripts/check-fixtures
      - name: Check README programs
        run: go run ./scripts/check-readme
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.go }}
          path: coverage.out
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
      - run: staticcheck ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Build a fresh consumer
        run: |
          go build ./...
          mkdir /tmp/consumer
          cp scripts/consumer/main.go /tmp/consumer/main.go
          cd /tmp/consumer
          go mod init example.com/consumer
          go mod edit -replace github.com/EASYSLIP-CO-LTD/sdk-go="$GITHUB_WORKSPACE"
          go mod tidy
          go run .
  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: python -m pip install zizmor==1.31.1
      - run: python -m unittest discover -s scripts -p test_release.py
      - run: actionlint && zizmor --no-progress .github/workflows
  integration:
    name: Integration
    environment: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EASYSLIP_API_KEY: ${{ secrets.EASYSLIP_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - if: env.EASYSLIP_API_KEY != ''
        run: go test -run '^TestAccountInfoIntegration$' .
        env:
          EASYSLIP_READ_INTEGRATION: '1'
      - if: env.EASYSLIP_API_KEY == ''
        run: echo 'Integration skipped because EASYSLIP_API_KEY is not configured.'
