name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published version tag to publish again (v1.0.0)
        required: true
        type: string
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Create the version tag and GitHub release.
      pull-requests: write # Open the version update pull request.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
  target:
    name: Resolve existing release
    needs: release-please
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.release-please.result == 'success' &&
      needs.release-please.outputs.release_created == 'true') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Resolve immutable tag commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          AUTOMATIC_TAG: ${{ needs.release-please.outputs.tag_name }}
          AUTOMATIC_SHA: ${{ needs.release-please.outputs.sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: python scripts/release.py resolve
  publish:
    name: Publish validated release
    needs: [release-please, target]
    if: >-
      always() && needs.target.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # Attach artifacts to the existing release.
      id-token: write # Obtain short-lived publishing and attestation identity.
      attestations: write # Store signed artifact provenance.
    env:
      RELEASE_TAG: ${{ needs.target.outputs.tag }}
      RELEASE_SHA: ${{ needs.target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Check tag commit and package version
        run: python scripts/release.py check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Test and archive the exact release
        run: |
          go test ./...
          go build ./...
          git archive --format=tar.gz --output=sdk-go.tar.gz HEAD
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sdk-go.tar.gz
      - name: Check the module proxy and exact-version consumer
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          for attempt in $(seq 1 12); do
            if version=$(go list -m -f '{{.Version}}' "github.com/EASYSLIP-CO-LTD/sdk-go@$RELEASE_TAG") &&
              [ "$version" = "$RELEASE_TAG" ]; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 10
          done
          mkdir /tmp/published
          cp scripts/consumer/main.go /tmp/published/main.go
          cd /tmp/published
          go mod init example.com/consumer
          go get "github.com/EASYSLIP-CO-LTD/sdk-go@$RELEASE_TAG"
          go run .
      - name: Attach release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" sdk-go.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
